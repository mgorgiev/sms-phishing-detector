[project]
name = "model-service"
version = "0.1.0"
description = "HTTP inference service for the SMS classifier (ONNX Runtime, no torch)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["model: needs the exported model in MODEL_DIR"]
