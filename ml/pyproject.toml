[project]
name = "smishing"
version = "0.1.0"
description = "SMS phishing detection: data preparation, TF-IDF baseline, DistilBERT training and ONNX export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
train = [
    "torch>=2.6",
    "transformers>=4.45",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "onnxruntime>=1.20",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smishing"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
